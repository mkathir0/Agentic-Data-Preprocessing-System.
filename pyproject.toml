[project]
name = "ai-data-engineer-backend"
version = "0.1.0"
description = "Backend for AI Data Engineer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlalchemy>=2.0.29",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.2",
    "litellm>=1.35.0",
    "langgraph>=0.0.35",
    "httpx>=0.28.1",
    "ydata-profiling>=4.18.4",
    "pandera>=0.32.1",
    "setuptools<70.0.0",
    "instructor>=1.15.4",
    "langchain-core>=1.5.0",
    "langchain-groq>=1.1.3",
    "langsmith>=0.14.17",
    "openpyxl>=3.1.5",
    "fastparquet>=2026.5.0",
    "pyarrow>=25.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
